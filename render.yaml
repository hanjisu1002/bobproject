services:
  - type: web
    name: bobproject-server
    environment:
    rootDir: .              # 현재 루트 디렉토리 (app/ 폴더가 여기 있음)
    buildCommand: pip install --upgrade pip setuptools wheel && PIP_PREFER_BINARY=1 pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6  # Python 3.13 대신 3.11 사용 (torch-cpu 호환성)
      - key: DATABASE_URL
        value: postgresql://smartbite_user:06WMuWM221m8uikEmZ7F3Y1jcDT2eVF7@dpg-d2j9eendiees73bupsm0-a.singapore-postgres.render.com/smartbite
      - key: TZ
        value: Asia/Seoul
      
      # 메모리 최적화 환경변수 (극한 최적화)
      - key: PYTORCH_CUDA_ALLOC_CONF
        value: max_split_size_mb:2  # 메모리 블록 크기 최소화
      - key: TRANSFORMERS_CACHE
        value: /tmp/transformers_cache
      - key: HF_HOME
        value: /tmp/huggingface
      - key: TOKENIZERS_PARALLELISM
        value: false
      - key: PYTORCH_NO_CUDA_MEMORY_CACHING
        value: "1"  # CUDA 메모리 캐싱 비활성화
      - key: OMP_NUM_THREADS
        value: "1"  # OpenMP 스레드 수 제한
      - key: MKL_NUM_THREADS
        value: "1"  # MKL 스레드 수 제한
      - key: NUMEXPR_NUM_THREADS
        value: "1"  # NumExpr 스레드 수 제한
      - key: OPENBLAS_NUM_THREADS
        value: "1"  # OpenBLAS 스레드 수 제한
      
      # CV 모델 최적화
      - key: YOLO_CONFIG_DIR
        value: /tmp/yolo_config  # YOLO 설정 디렉토리
      - key: ULTRA_OFFLINE
        value: "1"  # Ultralytics 오프라인 모드
      - key: ONNX_OPTIMIZATION_LEVEL
        value: "1"  # ONNX 최적화 레벨 낮춤
      
      # 추가 메모리 최적화
      - key: TRANSFORMERS_OFFLINE
        value: "1"  # 오프라인 모드로 메모리 절약
      - key: HF_DATASETS_OFFLINE
        value: "1"  # 데이터셋 오프라인 모드
      - key: PYTHONUNBUFFERED
        value: "1"  # Python 출력 버퍼링 비활성화
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"  # Python 바이트코드 파일 생성 비활성화
      
      # Python 가비지 컬렉션 최적화
      - key: PYTHONMALLOC
        value: malloc  # 메모리 할당자 최적화
      - key: PYTHONHASHSEED
        value: "0"  # 해시 시드 고정으로 메모리 안정화
      
      # 메모리 제한 설정
      - key: PYTHONMALLOC_LIMIT
        value: "400"  # Python 메모리 사용량 제한 (MB)
      - key: MAX_WORKERS
        value: "1"  # 워커 수 제한
